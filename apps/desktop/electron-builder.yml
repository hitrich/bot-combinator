appId: app.bot-combinator.desktop
productName: Bot Combinator
copyright: Copyright © 2026 Bot Combinator contributors
artifactName: Bot-Combinator-${version}-${os}-${arch}.${ext}
asar: true
compression: maximum
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
  - '!node_modules/**/*'
  - node_modules/sql.js/**/*
extraResources:
  - from: resources/generated
    to: resources
    filter:
      - '**/*'
  - from: ../../LICENSE
    to: LICENSE
  - from: ../../NOTICE
    to: NOTICE
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
mac:
  icon: build/icon.icns
  category: public.app-category.business
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
  verifyUpdateCodeSignature: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  executableName: bot-combinator
  syncDesktopName: true
  icon: build/icons
  category: Office
  synopsis: Local-first fundraising operating system
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  maintainer: Bot Combinator contributors
