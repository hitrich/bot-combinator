name: Verified desktop release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-preflight:
    name: Signed tag and release readiness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      mac_signing: ${{ steps.signing-readiness.outputs.mac_signing }}
      windows_signing: ${{ steps.signing-readiness.outputs.windows_signing }}
      tag_verification: ${{ steps.tag-preflight.outputs.tag_verification }}
      tag_verification_reason: ${{ steps.tag-preflight.outputs.tag_verification_reason }}
    permissions:
      checks: read
      contents: read
    steps:
      - name: Check out the complete annotated-tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require signed annotated tag at current main
        id: tag-preflight
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
              core.setFailed(`Ref ${context.ref} is not a semantic v* release tag`);
              return;
            }
            const ref = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`,
            });
            if (ref.data.object.type !== 'tag') {
              core.setFailed(`${tag} is lightweight; an annotated tag is required`);
              return;
            }
            const tagObject = await github.rest.git.getTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_sha: ref.data.object.sha,
            });
            const verification = tagObject.data.verification;
            if (!verification?.verified) {
              core.setFailed(
                `${tag} must have a GitHub-verified PGP or SSH signature because private repositories on the organization Free plan cannot enforce tag rulesets`,
              );
              return;
            }
            const tagVerification = 'github-verified';
            core.setOutput('tag_verification', tagVerification);
            core.setOutput('tag_verification_reason', verification?.reason ?? 'unknown');
            core.notice(`${tag} has a GitHub-verified signature.`);
            if (tagObject.data.object.type !== 'commit') {
              core.setFailed(`${tag} must directly reference a commit`);
              return;
            }
            const main = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (tagObject.data.object.sha !== main.data.object.sha) {
              core.setFailed(`${tag} must reference the current main commit ${main.data.object.sha}`);
              return;
            }
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: main.data.object.sha,
              filter: 'latest',
              per_page: 100,
            });
            for (const requiredCheck of ['All native targets']) {
              const passed = checkRuns.some(
                (run) =>
                  run.name === requiredCheck &&
                  run.conclusion === 'success' &&
                  run.app?.slug === 'github-actions',
              );
              if (!passed) {
                core.setFailed(
                  `Current main is missing a successful GitHub Actions check: ${requiredCheck}`,
                );
                return;
              }
            }
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.setFailed(`A GitHub release for ${tag} already exists; release assets are immutable`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Generate release notices
        run: |
          pnpm run licenses
          node scripts/validate-legal-notices.mjs

      - name: Verify tag, version, and release files
        run: node scripts/verify-release.mjs

      - name: Assess optional signing and notarization upgrades
        id: signing-readiness
        run: node scripts/validate-release-secrets.mjs --policy optional
        env:
          BOT_COMBINATOR_MAC_CERTIFICATE_BASE64: ${{ secrets.BOT_COMBINATOR_MAC_CERTIFICATE_BASE64 }}
          BOT_COMBINATOR_MAC_CERTIFICATE_PASSWORD: ${{ secrets.BOT_COMBINATOR_MAC_CERTIFICATE_PASSWORD }}
          BOT_COMBINATOR_MAC_EXPECTED_TEAM_ID: ${{ secrets.BOT_COMBINATOR_MAC_EXPECTED_TEAM_ID }}
          BOT_COMBINATOR_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.BOT_COMBINATOR_WINDOWS_CERTIFICATE_BASE64 }}
          BOT_COMBINATOR_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.BOT_COMBINATOR_WINDOWS_CERTIFICATE_PASSWORD }}
          BOT_COMBINATOR_WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.BOT_COMBINATOR_WINDOWS_EXPECTED_PUBLISHER }}
          BOT_COMBINATOR_APPLE_API_KEY_BASE64: ${{ secrets.BOT_COMBINATOR_APPLE_API_KEY_BASE64 }}
          BOT_COMBINATOR_APPLE_API_KEY_ID: ${{ secrets.BOT_COMBINATOR_APPLE_API_KEY_ID }}
          BOT_COMBINATOR_APPLE_API_ISSUER: ${{ secrets.BOT_COMBINATOR_APPLE_API_ISSUER }}
          BOT_COMBINATOR_APPLE_ID: ${{ secrets.BOT_COMBINATOR_APPLE_ID }}
          BOT_COMBINATOR_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.BOT_COMBINATOR_APPLE_APP_SPECIFIC_PASSWORD }}
          BOT_COMBINATOR_APPLE_TEAM_ID: ${{ secrets.BOT_COMBINATOR_APPLE_TEAM_ID }}

  native-release:
    name: ${{ matrix.target }} verified package
    needs: release-preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
          - target: macos-arm64
            runner: macos-15
            platform: darwin
            arch: arm64
          - target: windows-x64
            runner: windows-2025
            platform: win32
            arch: x64
          - target: windows-arm64
            runner: windows-11-arm
            platform: win32
            arch: arm64
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
    steps:
      - name: Check out protected release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up native Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          architecture: ${{ matrix.arch }}
          package-manager-cache: false

      - name: Activate pinned pnpm with Corepack
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
          pnpm config set store-dir "${{ runner.temp }}/pnpm-store"

      - name: Assert runner architecture
        run: node scripts/assert-architecture.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Self-test release utilities
        run: node scripts/self-test.mjs

      - name: Install frozen dependency graph
        run: pnpm install --frozen-lockfile

      - name: Run full verification gate
        run: pnpm verify

      - name: Run Electron end-to-end tests
        if: runner.os != 'Linux'
        run: pnpm test:e2e

      - name: Run Electron end-to-end tests under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Generate and validate third-party notices
        run: |
          pnpm run licenses
          node scripts/validate-legal-notices.mjs

      - name: Build signed and notarized macOS release package
        if: runner.os == 'macOS' && needs.release-preflight.outputs.mac_signing == 'signed'
        run: node scripts/package-signed-target.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
        env:
          BOT_COMBINATOR_MAC_CERTIFICATE_BASE64: ${{ secrets.BOT_COMBINATOR_MAC_CERTIFICATE_BASE64 }}
          BOT_COMBINATOR_MAC_CERTIFICATE_PASSWORD: ${{ secrets.BOT_COMBINATOR_MAC_CERTIFICATE_PASSWORD }}
          BOT_COMBINATOR_APPLE_API_KEY_BASE64: ${{ secrets.BOT_COMBINATOR_APPLE_API_KEY_BASE64 }}
          BOT_COMBINATOR_APPLE_API_KEY_ID: ${{ secrets.BOT_COMBINATOR_APPLE_API_KEY_ID }}
          BOT_COMBINATOR_APPLE_API_ISSUER: ${{ secrets.BOT_COMBINATOR_APPLE_API_ISSUER }}
          BOT_COMBINATOR_APPLE_ID: ${{ secrets.BOT_COMBINATOR_APPLE_ID }}
          BOT_COMBINATOR_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.BOT_COMBINATOR_APPLE_APP_SPECIFIC_PASSWORD }}
          BOT_COMBINATOR_APPLE_TEAM_ID: ${{ secrets.BOT_COMBINATOR_APPLE_TEAM_ID }}

      - name: Build explicitly unsigned and unnotarized macOS package
        if: runner.os == 'macOS' && needs.release-preflight.outputs.mac_signing == 'unsigned'
        run: node scripts/package-target.mjs --unsigned --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Build signed Windows release package
        if: runner.os == 'Windows' && needs.release-preflight.outputs.windows_signing == 'signed'
        run: node scripts/package-signed-target.mjs --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
        env:
          BOT_COMBINATOR_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.BOT_COMBINATOR_WINDOWS_CERTIFICATE_BASE64 }}
          BOT_COMBINATOR_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.BOT_COMBINATOR_WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Build explicitly unsigned Windows package
        if: runner.os == 'Windows' && needs.release-preflight.outputs.windows_signing == 'unsigned'
        run: node scripts/package-target.mjs --unsigned --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Build Linux release package
        if: runner.os == 'Linux'
        run: node scripts/package-target.mjs --release --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Verify packaged seed, notices, and agent sidecars
        run: node scripts/verify-packaged-resources.mjs --release-dir apps/desktop/release

      - name: Verify hardened Electron fuses
        run: node scripts/verify-electron-fuses.mjs --release-dir apps/desktop/release

      - name: Verify macOS signer, Gatekeeper, and notarization
        if: runner.os == 'macOS' && needs.release-preflight.outputs.mac_signing == 'signed'
        run: node scripts/verify-code-signing.mjs --expect signed --release-dir apps/desktop/release
        env:
          BOT_COMBINATOR_MAC_EXPECTED_TEAM_ID: ${{ secrets.BOT_COMBINATOR_MAC_EXPECTED_TEAM_ID }}

      - name: Verify Windows publisher and timestamped Authenticode signatures
        if: runner.os == 'Windows' && needs.release-preflight.outputs.windows_signing == 'signed'
        run: node scripts/verify-code-signing.mjs --expect signed --release-dir apps/desktop/release
        env:
          BOT_COMBINATOR_WINDOWS_EXPECTED_PUBLISHER: ${{ secrets.BOT_COMBINATOR_WINDOWS_EXPECTED_PUBLISHER }}

      - name: Verify explicit unsigned and unnotarized macOS status
        if: runner.os == 'macOS' && needs.release-preflight.outputs.mac_signing == 'unsigned'
        run: node scripts/verify-code-signing.mjs --expect unsigned --release-dir apps/desktop/release

      - name: Verify explicit unsigned Windows status
        if: runner.os == 'Windows' && needs.release-preflight.outputs.windows_signing == 'unsigned'
        run: node scripts/verify-code-signing.mjs --expect unsigned --release-dir apps/desktop/release

      - name: Record Linux integrity controls
        if: runner.os == 'Linux'
        run: node scripts/verify-code-signing.mjs --expect checksum-provenance --release-dir apps/desktop/release

      - name: Smoke packaged app
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged-app.mjs --release-dir apps/desktop/release

      - name: Smoke packaged app under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke-packaged-app.mjs --release-dir apps/desktop/release

      - name: Collect macOS distributable artifacts
        if: runner.os == 'macOS'
        run: node scripts/collect-release-artifacts.mjs --release-dir apps/desktop/release
        env:
          BOT_COMBINATOR_TARGET: ${{ matrix.target }}
          BOT_COMBINATOR_RELEASE_MODE: ${{ needs.release-preflight.outputs.mac_signing }}

      - name: Collect Windows distributable artifacts
        if: runner.os == 'Windows'
        run: node scripts/collect-release-artifacts.mjs --release-dir apps/desktop/release
        env:
          BOT_COMBINATOR_TARGET: ${{ matrix.target }}
          BOT_COMBINATOR_RELEASE_MODE: ${{ needs.release-preflight.outputs.windows_signing }}

      - name: Collect Linux distributable artifacts
        if: runner.os == 'Linux'
        run: node scripts/collect-release-artifacts.mjs --release-dir apps/desktop/release
        env:
          BOT_COMBINATOR_TARGET: ${{ matrix.target }}
          BOT_COMBINATOR_RELEASE_MODE: checksum-provenance

      - name: Write macOS package trust disclosure
        if: runner.os == 'macOS'
        run: node scripts/write-signing-status.mjs
        env:
          BOT_COMBINATOR_TARGET: ${{ matrix.target }}
          BOT_COMBINATOR_RELEASE_MODE: ${{ needs.release-preflight.outputs.mac_signing }}
          BOT_COMBINATOR_TAG_VERIFICATION: ${{ needs.release-preflight.outputs.tag_verification }}
          BOT_COMBINATOR_TAG_VERIFICATION_REASON: ${{ needs.release-preflight.outputs.tag_verification_reason }}

      - name: Write Windows package trust disclosure
        if: runner.os == 'Windows'
        run: node scripts/write-signing-status.mjs
        env:
          BOT_COMBINATOR_TARGET: ${{ matrix.target }}
          BOT_COMBINATOR_RELEASE_MODE: ${{ needs.release-preflight.outputs.windows_signing }}
          BOT_COMBINATOR_TAG_VERIFICATION: ${{ needs.release-preflight.outputs.tag_verification }}
          BOT_COMBINATOR_TAG_VERIFICATION_REASON: ${{ needs.release-preflight.outputs.tag_verification_reason }}

      - name: Write Linux package trust disclosure
        if: runner.os == 'Linux'
        run: node scripts/write-signing-status.mjs
        env:
          BOT_COMBINATOR_TARGET: ${{ matrix.target }}
          BOT_COMBINATOR_RELEASE_MODE: checksum-provenance
          BOT_COMBINATOR_TAG_VERIFICATION: ${{ needs.release-preflight.outputs.tag_verification }}
          BOT_COMBINATOR_TAG_VERIFICATION_REASON: ${{ needs.release-preflight.outputs.tag_verification_reason }}

      - name: Generate CycloneDX SBOM
        run: node scripts/generate-sbom.mjs --target ${{ matrix.target }} --output artifacts/${{ matrix.target }}/bot-combinator-${{ matrix.target }}.cdx.json

      - name: Generate local SLSA-format provenance
        run: node scripts/generate-provenance.mjs --target ${{ matrix.target }} --artifact-dir artifacts/${{ matrix.target }} --output artifacts/${{ matrix.target }}/bot-combinator-${{ matrix.target }}.provenance.json

      - name: Optionally GPG-sign Linux packages
        if: runner.os == 'Linux'
        run: node scripts/sign-linux-artifacts.mjs --directory artifacts/${{ matrix.target }}
        env:
          BOT_COMBINATOR_LINUX_GPG_PRIVATE_KEY: ${{ secrets.BOT_COMBINATOR_LINUX_GPG_PRIVATE_KEY }}
          BOT_COMBINATOR_LINUX_GPG_PASSPHRASE: ${{ secrets.BOT_COMBINATOR_LINUX_GPG_PASSPHRASE }}

      - name: Generate and verify SHA-256 manifest
        run: |
          node scripts/generate-checksums.mjs --directory artifacts/${{ matrix.target }} --output artifacts/${{ matrix.target }}/SHA256SUMS-${{ matrix.target }}
          node scripts/verify-checksums.mjs --manifest artifacts/${{ matrix.target }}/SHA256SUMS-${{ matrix.target }}

      - name: Upload verified native release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bot-combinator-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub release
    needs: native-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out release metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          package-manager-cache: false

      - name: Download all six native bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: bot-combinator-*
          path: release-assets

      - name: Verify all release bundles and checksums
        run: node scripts/verify-release-bundle.mjs --directory release-assets

      - name: Stage collision-free GitHub release assets
        run: node scripts/stage-publish-assets.mjs --input release-assets --output publish-assets

      - name: Upload immutable assets to a private draft release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          publish-assets/*
          --draft
          --generate-notes
          --notes-file publish-assets/RELEASE-TRUST.md
          --title "Bot Combinator $GITHUB_REF_NAME"
          --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download the draft release assets for independent comparison
        run: gh release download "$GITHUB_REF_NAME" --dir downloaded-publish-assets
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify every uploaded draft asset byte-for-byte
        run: node scripts/verify-published-assets.mjs --expected publish-assets --actual downloaded-publish-assets

      - name: Publish verified stable release
        if: ${{ !contains(github.ref_name, '-') }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish verified prerelease
        if: ${{ contains(github.ref_name, '-') }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Confirm the private-repository release is immutable
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const release = await github.request(
              'GET /repos/{owner}/{repo}/releases/tags/{tag}',
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: context.ref.replace('refs/tags/', ''),
                headers: { 'X-GitHub-Api-Version': '2026-03-10' },
              },
            );
            if (release.data.draft || release.data.immutable !== true) {
              core.setFailed('The published private-repository release is not immutable');
            }

      - name: Download the immutable repository release assets
        run: gh release download "$GITHUB_REF_NAME" --dir downloaded-release-assets
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify every immutable release asset byte-for-byte
        run: node scripts/verify-published-assets.mjs --expected publish-assets --actual downloaded-release-assets
